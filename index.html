<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AROH Foundation · Expenses A/C</title>
<meta name="theme-color" content="#1f3b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AROH">
<style>
:root{--ink:#000;--bar:#1f3b5c;--bg:#eef1f5;--hl:#fff6c9;--mut:#5b6b7c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.tools{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools b{font-size:15px;margin-right:6px}
.tools select,.tools input{font:inherit;font-size:13px;padding:4px 6px;border-radius:4px;border:1px solid #9fb3c8}
.tools label{font-size:12px;display:flex;align-items:center;gap:4px}
.btn{font:inherit;font-size:13px;padding:5px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:#ffd54a;color:#1f2a37;border-color:#ffd54a;font-weight:700}
.sp{flex:1}
.note{font-size:12px;color:var(--mut);text-align:center;padding:6px 12px}
.wrap{overflow-x:auto;padding:12px 16px 40px}
.page{background:#fff;width:1000px;margin:0 auto;padding:24px 28px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
table.s{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.s td{border:1px solid #000;padding:2px 4px;height:21px;vertical-align:middle;overflow:hidden}
table.s .outer{border:2px solid #000}
.c{text-align:center}.r{text-align:right}.b{font-weight:700}
.grey{background:#d9d9d9}
.nb{border:none!important}
.nbt{border-top:none!important}.nbb{border-bottom:none!important}.nbl{border-left:none!important}.nbr{border-right:none!important}
[contenteditable]{outline:none;min-height:1em;display:block}
[contenteditable]:hover{background:#f6f9fc}
[contenteditable]:focus{background:var(--hl)}
.in{display:inline-block;min-width:30px}
[data-l],[data-k]{white-space:pre-line}
span[data-l]{display:inline-block;min-width:8px}
.page [contenteditable]:empty::before{content:"\00a0"}
.big{font-size:15px}
.sign{height:64px;display:block;margin-left:auto}
.rowtools{width:22px;border:none!important;padding:0!important;text-align:center}
.rowtools button{border:0;background:none;color:#b42318;cursor:pointer;font-size:14px;line-height:1;padding:0}
.signbox{position:relative}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  .tools,.note,.rowtools,.noprint{display:none!important}
  .wrap{padding:0;overflow:visible}
  col.tc{width:0!important}
  table.s{width:100%}
  .page{box-shadow:none;width:auto;padding:0}
  [contenteditable]:hover,[contenteditable]:focus{background:none}
}
</style>
</head>
<body>
<div class="tools">
  <b>AROH Foundation</b>
  <label>Form <select id="pick" aria-label="Saved forms"></select></label>
  <button class="btn" id="new" type="button" title="Naam, centre, sign wahi; entries khaali">+ New month</button>
  <button class="btn" id="blank" type="button" title="Bilkul khaali form">+ Khaali form</button>
  <button class="btn" id="dup" type="button">Copy</button>
  <button class="btn" id="del" type="button">Delete</button>
  <span class="sp"></span>
  <label>Period <input type="date" id="pf"> to <input type="date" id="pt"></label>
  <button class="btn" id="addrow" type="button">+ Row</button>
  <button class="btn" id="fill" type="button" title="Jo khaane khaali hain unme default bhar do">Default bharo</button>
  <button class="btn" id="signbtn" type="button">Change sign</button>
  <button class="btn" id="signtog" type="button">Sign hatao</button>
  <input type="file" id="signfile" accept="image/*" hidden>
  <button class="btn pri" id="print" type="button">Print / PDF</button>
  <button class="btn" id="install" type="button">⬇ Add to Home Screen / Download App</button>
</div>
<div class="note">Har cheez par click karke badal sakte ho (heading aur column ke naam bhi). Total, Balance aur Amount Due apne aap bante hain. Sab isi browser mein apne aap save hota hai.</div>

// "20/9/26", "2026-09-20", "20-9-2026", "20 sep 26" -> "20-Sep-26"
function normDate(t){
  t=String(t||"").trim(); if(!t) return ""; let d,m,y, x;
  if((x=t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=t.match(/^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})$/))){ d=+x[1]; m=+x[2]; y=+x[3]; }
  else if((x=t.match(/^(\d{1,2})[-/. ]?([A-Za-z]{3})[A-Za-z]*[-/. ]?(\d{2,4})$/))){ d=+x[1]; m=MON.findIndex(n=>n.toLowerCase()===x[2].toLowerCase())+1; y=+x[3]; }
  else return t;
  if(!m||m>12||!d||d>31) return t; if(y<100) y+=2000;
  return `${d}-${MON[m-1]}-${String(y).slice(2)}`;
}

function newForm(prev){

    h+=`<tr><td class="b" style="border-left:2px solid #000">${has?i+1:""}</td><td>${R(i,"dd","c")}</td><td>${R(i,"dp")}</td><td>${R(i,"da","r")}</td><td class="grey"></td><td class="b">${R(i,"cd")}</td><td>${R(i,"cp")}</td><td class="b">${R(i,"ca","c")}</td><td style="border-right:2px solid #000">${R(i,"rm","c")}</td><td class="rowtools"><button type="button" data-delrow="${i}" title="Remove this row" aria-label="Remove row ${i+1}">×</button></td></tr>`;
  });
  h+=`<tr><td style="border-left:2px solid #000"></td><td></td><td class="c">${L("bal")}</td><td class="c" id="drtot">${f2(T.dr)}</td><td class="grey"></td><td></td><td class="b">${L("tot")}</td><td class="b r" id="crtot">${fInt(T.cr)}</td><td style="border-right:2px solid #000"></td><td class="rowtools"></td></tr>`;
  h+=`<tr><td style="border-left:2px solid #000"></td><td></td><td></td><td></td><td></td><td colspan="4" rowspan="7" class="nbb" style="border-right:2px solid #000;border-bottom:2px solid #000!important;vertical-align:bottom;padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr><td class="nb" style="width:24%"></td><td class="nb" style="width:42%"></td><td class="nb" rowspan="3" style="vertical-align:bottom;padding-right:10px"><div class="signbox">${cur.sign!=="none"?`<img class="sign" alt="Sign" src="${esc(cur.sign||SIGN_DEFAULT)}">`:""}</div></td></tr>
        <tr><td class="nb b" style="padding:6px 0 6px 60px;white-space:nowrap">${L("subL")}</td><td class="nb b" style="padding-left:14px">${E("sub")}</td></tr>
        <tr><td class="nb b" style="padding:6px 0 6px 60px">${L("sdesL")}</td><td class="nb b" style="padding-left:14px">${E("sdesig")}</td></tr>
        <tr><td class="nb b big" colspan="2" style="padding:8px 0 4px 60px">${L("dateL","in")} <span contenteditable="true" spellcheck="false" data-k="dateTxt" class="in">${esc(longDate(cur.date))}</span></td><td class="nb r" style="padding:8px 30px 4px 0">${L("signL")}</td></tr>
      </table></td><td class="rowtools"></td></tr>`;
  h+=`<tr><td colspan="3" class="c b" style="border-left:2px solid #000">${L("sum")}</td><td></td><td></td><td class="rowtools"></td></tr>`;
  h+=`<tr><td colspan="3" class="c" style="border-left:2px solid #000">${L("sTot")}</td><td class="c" id="s-tot">${f2(T.cr)}</td><td></td><td class="rowtools"></td></tr>`;
  h+=`<tr><td colspan="3" class="c" style="border-left:2px solid #000">${L("sAdv")}</td><td class="c"><span contenteditable="true" spellcheck="false" data-k="advTxt" title="Apne aap Dr. side ka total aata hai; chaho to badal sakte ho">${f2(T.adv)}</span></td><td></td><td class="rowtools"></td></tr>`;
  h+=`<tr><td colspan="3" rowspan="2" class="c" style="border-left:2px solid #000">${L("sEx")}</td><td class="c" rowspan="2"><span contenteditable="true" spellcheck="false" data-k="excess">${esc(cur.excess)}</span></td><td rowspan="2"></td><td class="rowtools"></td></tr><tr><td class="rowtools"></td></tr>`;
  h+=`<tr class="b" style="font-size:15px"><td colspan="3" class="c" style="border-left:2px solid #000;border-bottom:2px solid #000">${L("sDue")}</td><td class="c" style="border:2px solid #000"><span contenteditable="true" spellcheck="false" data-k="dueTxt" title="Apne aap banta hai: Total - Advance - Excess">${f2(T.due)}</span></td><td style="border-bottom:2px solid #000"></td><td class="rowtools"></td></tr>`;
  $("#sheet").innerHTML=h;
}
function refreshTotals(){
  const T=totals(); const tds=$("#sheet");
  // update only computed cells so the caret is not lost while typing
  const set=(sel,v)=>{ const el=tds.querySelector(sel); if(el && document.activeElement!==el) el.textContent=v; };
  set("#drtot", f2(T.dr));
  set("#crtot", fInt(T.cr)); set("#s-tot", f2(T.cr)); set('[data-k="advTxt"]', f2(T.adv)); set('[data-k="dueTxt"]', f2(T.due));
  // S.No.
  cur.rows.forEach((r,i)=>{ const tr=tds.querySelector(`[data-r="${i}"]`).closest("tr"); const has=r.dd||r.dp||r.da||r.cd||r.cp||r.ca||r.rm; tr.cells[0].textContent=has?i+1:""; });
}
$("#sheet").addEventListener("input", e=>{
  const el=e.target.closest("[contenteditable]"); if(!el) return; const v=el.innerText.replace(/\n+$/,"");
  if(el.dataset.l){ cur.L[el.dataset.l]=v; save(); return; }
  if(el.dataset.r!==undefined){ cur.rows[+el.dataset.r][el.dataset.c]=v; }
  else { const k=el.dataset.k;
    if(k==="advTxt"){ cur.advAuto=false; cur.adv=v; }
    else if(k==="dueTxt"){ cur.dueAuto=false; cur.due=v; }
    else if(k==="dateTxt"){ /* handled on blur */ }
    else cur[k]=v; }
  refreshTotals(); save(); if(["name","centre"].includes(el.dataset.k)) renderPick();
});
$("#sheet").addEventListener("focusout", e=>{
  const el=e.target.closest("[contenteditable]"); if(!el) return;
  if(el.dataset.c==="dd"||el.dataset.c==="cd"){ const v=normDate(el.innerText); cur.rows[+el.dataset.r][el.dataset.c]=v; el.textContent=v; save(); }
  if(el.dataset.k==="dateTxt"){ const n=normDate(el.innerText); const x=n.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/); if(x){ cur.date=iso(new Date(2000+ +x[3], MON.indexOf(x[2]), +x[1])); } else if(!el.innerText.trim()) cur.date=""; el.textContent=longDate(cur.date); save(); }
  if(el.dataset.k==="advTxt" && !el.innerText.trim()){ cur.advAuto=true; refreshTotals(); save(); }
  if(el.dataset.k==="dueTxt" && !el.innerText.trim()){ cur.dueAuto=true; refreshTotals(); save(); }
  if(["advTxt","dueTxt"].includes(el.dataset.k)) refreshTotals();
});
// Enter moves to the next box instead of adding a new line (Shift+Enter adds a line)
$("#sheet").addEventListener("keydown", e=>{
  if(e.key!=="Enter" || e.shiftKey) return; const el=e.target.closest("[contenteditable]"); if(!el) return; e.preventDefault();
  const all=[...document.querySelectorAll("#sheet [contenteditable]")]; const n=all[all.indexOf(el)+1]; if(n) n.focus(); else el.blur();
});
$("#sheet").addEventListener("paste", e=>{ const el=e.target.closest("[contenteditable]"); if(!el) return; e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData||window.clipboardData).getData("text/plain")); });
$("#sheet").addEventListener("click", e=>{ const b=e.target.closest("[data-delrow]"); if(!b) return; cur.rows.splice(+b.dataset.delrow,1); if(!cur.rows.length) cur.rows=blankRows(1); render(); save(); });
$("#addrow").addEventListener("click", ()=>{
  // fill the first empty row's remark with the next attachment number when a row gets data later; here just add a row
  cur.rows.push(blankRows(1)[0]); render(); save(); const r=cur.rows.length-1; const el=document.querySelector(`[data-r="${r}"][data-c="cd"]`); if(el) el.focus();
});
// auto "Attachment-0N" when a Cr amount is typed and the remark is empty
$("#sheet").addEventListener("focusout", e=>{ const el=e.target.closest('[data-c="ca"]'); if(!el) return; const i=+el.dataset.r, r=cur.rows[i]; if(num(r.ca) && !r.rm){ const n=cur.rows.slice(0,i+1).filter(x=>num(x.ca)).length; r.rm="Attachment-"+String(n).padStart(2,"0"); const t=document.querySelector(`[data-r="${i}"][data-c="rm"]`); if(t) t.textContent=r.rm; refreshTotals(); save(); } });
$("#pf").addEventListener("change", e=>{ cur.pf=e.target.value; $("#period").innerHTML=periodHTML(cur.pf,cur.pt); save(); });
$("#pt").addEventListener("change", e=>{ cur.pt=e.target.value; if(e.target.value) cur.date=e.target.value; render(); renderPick(); save(); });
$("#pick").addEventListener("change", e=>{ cur=forms.find(f=>f.id===e.target.value)||cur; render(); renderPick(); save(); });
$("#new").addEventListener("click", ()=>{ const f=newForm(cur); forms.push(f); cur=f; render(); renderPick(); save(); });
$("#blank").addEventListener("click", ()=>{ const f=newForm(); for(const k of Object.keys(DEF)) f[k]=""; f.L=Object.fromEntries(Object.keys(DEFL).map(k=>[k,""])); f.sign="none"; f.pf=""; f.pt=""; f.date=""; forms.push(f); cur=f; render(); renderPick(); save(); });
$("#fill").addEventListener("click", ()=>{ for(const k of Object.keys(DEF)) if(!String(cur[k]||"").trim()) cur[k]=DEF[k]; for(const k of Object.keys(DEFL)) if(!String(cur.L[k]||"").trim()) cur.L[k]=DEFL[k]; if(cur.sign==="none") cur.sign=""; render(); renderPick(); save(); });
$("#signtog").addEventListener("click", ()=>{ cur.sign = cur.sign==="none" ? "" : "none"; render(); signBtn(); save(); });
function signBtn(){ $("#signtog").textContent = cur.sign==="none" ? "Sign lagao" : "Sign hatao"; }
$("#dup").addEventListener("click", ()=>{ const f=JSON.parse(JSON.stringify(cur)); f.id="f"+Date.now().toString(36); forms.push(f); cur=f; render(); renderPick(); save(); });
$("#del").addEventListener("click", ()=>{ if(!confirm("Ye form delete karna hai? Wapas nahi aayega.")) return; forms=forms.filter(f=>f!==cur); if(!forms.length) forms=[newForm()]; cur=forms[forms.length-1]; render(); renderPick(); save(); });
$("#print").addEventListener("click", ()=>{ document.activeElement && document.activeElement.blur && document.activeElement.blur(); const old=document.title; document.title=`Expenses ${label(cur)}`; window.print(); setTimeout(()=>document.title=old, 500); });
$("#signbtn").addEventListener("click", ()=>$("#signfile").click());
// Clean a photographed / scanned signature: remove the paper (even with shadows), keep only the ink, crop tight.
function cleanSign(img){
  const W=Math.min(1000, img.width), H=Math.round(img.height*W/img.width);
  const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.drawImage(img,0,0,W,H);
  const id=x.getImageData(0,0,W,H), p=id.data, n=W*H, g=new Float32Array(n);
  for(let i=0;i<n;i++) g[i]=0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2];
  // paper brightness: brightest values in blocks, smoothed (handles uneven light / shadows)
  const B=Math.max(8, Math.round(Math.min(W,H)/12)), bw=Math.ceil(W/B), bh=Math.ceil(H/B), bm=new Float32Array(bw*bh);
  for(let by=0;by<bh;by++) for(let bx=0;bx<bw;bx++){ const vals=[]; for(let y=by*B;y<Math.min(H,(by+1)*B);y+=2) for(let xx=bx*B;xx<Math.min(W,(bx+1)*B);xx+=2) vals.push(g[y*W+xx]); vals.sort((a,b)=>a-b); bm[by*bw+bx]=vals[Math.floor(vals.length*0.9)]||255; }
  const sm=new Float32Array(bw*bh); for(let by=0;by<bh;by++) for(let bx=0;bx<bw;bx++){ let t=0,k=0; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const yy=by+dy, xx=bx+dx; if(yy>=0&&yy<bh&&xx>=0&&xx<bw){ t+=bm[yy*bw+xx]; k++; } } sm[by*bw+bx]=t/k; }
  const bgAt=(xx,y)=>{ const fx=Math.min(bw-1.001,Math.max(0,xx/B-0.5)), fy=Math.min(bh-1.001,Math.max(0,y/B-0.5)), x0=Math.floor(fx), y0=Math.floor(fy), x1=Math.min(bw-1,x0+1), y1=Math.min(bh-1,y0+1), ax=fx-x0, ay=fy-y0;
    return (sm[y0*bw+x0]*(1-ax)+sm[y0*bw+x1]*ax)*(1-ay)+(sm[y1*bw+x0]*(1-ax)+sm[y1*bw+x1]*ax)*ay; };
  // noise level of the paper decides the threshold
  let minX=W,minY=H,maxX=-1,maxY=-1; const al=new Uint8ClampedArray(n);
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ const i=y*W+xx, bg=Math.max(40,bgAt(xx,y)), d=(bg-g[i])/bg; // relative darkness
    let a=(d-0.13)/0.22; a=a<0?0:a>1?1:a; al[i]=Math.round(a*255);
    if(a>0.35){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    // ink colour: remove the paper tint, then deepen it a little
    const k=255/bg; p[i*4]=Math.min(255,p[i*4]*k*0.8); p[i*4+1]=Math.min(255,p[i*4+1]*k*0.8); p[i*4+2]=Math.min(255,p[i*4+2]*k*0.8); p[i*4+3]=al[i]; }
  x.putImageData(id,0,0);
  if(maxX<0) return c.toDataURL("image/png");
  const pad=Math.round(Math.max(W,H)*0.03); minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
  const cw=maxX-minX+1, ch=maxY-minY+1, s2=Math.min(1, 640/cw), o=document.createElement("canvas"); o.width=Math.round(cw*s2); o.height=Math.round(ch*s2);
  o.getContext("2d").drawImage(c,minX,minY,cw,ch,0,0,o.width,o.height); return o.toDataURL("image/png");
}
$("#signfile").addEventListener("change", e=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ try{ cur.sign=cleanSign(img); }catch(err){ const c=document.createElement("canvas"); c.width=img.width; c.height=img.height; c.getContext("2d").drawImage(img,0,0); cur.sign=c.toDataURL("image/png"); } render(); signBtn(); save(); }; img.src=rd.result; }; rd.readAsDataURL(file); e.target.value=""; });

let deferredPrompt=null;
const standalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if(standalone()) $("#install").hidden=true;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener("appinstalled", ()=>{ $("#install").hidden=true; deferredPrompt=null; });
$("#install").addEventListener("click", async ()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; return; }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  alert(ios ? "iPhone par: Safari mein neeche Share button (⬆) dabao, phir 'Add to Home Screen' chuno."
            : "Chrome mein upar ⋮ menu kholo, phir 'Add to Home screen' ya 'Install app' chuno.");
});
